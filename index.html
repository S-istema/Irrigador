<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle Motor Arduino</title>
<style>
  body { font-family: sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 30px; }
  .box { background: #1e293b; padding: 20px; border-radius: 12px; width: 340px; border: 1px solid #334155; }
  h2 { margin: 0 0 8px; font-size: 1.2rem; text-align: center; }
  .status { text-align: center; font-size: 0.9rem; margin-bottom: 12px; color: #94a3b8; }
  button, input { width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px; border: none; font-weight: bold; box-sizing: border-box; }
  button { cursor: pointer; color: white; }
  .btn-con { background: #3b82f6; }
  .btn-on { background: #10b981; width: 48%; }
  .btn-off { background: #ef4444; width: 48%; float: right; }
  .btn-add { background: #8b5cf6; }
  input { background: #0f172a; color: white; border: 1px solid #334155; }
  ul { list-style: none; padding: 0; margin-top: 12px; }
  li { background: #0f172a; padding: 8px; margin-top: 5px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
  .del { width: auto; padding: 4px 8px; margin: 0; background: #475569; }
</style>
</head>
<body>

<div class="box">
  <h2>Controle do Motor</h2>
  <div class="status" id="status">Desconectado</div>
  <button class="btn-con" onclick="conectar()">Conectar Arduino</button>

  <div style="margin-top: 12px;">
    <button class="btn-on" onclick="enviar('1', 'LIGADO')">LIGAR</button>
    <button class="btn-off" onclick="enviar('0', 'DESLIGADO')">DESLIGAR</button>
  </div>
  <div class="status" style="margin-top: 10px;">Motor: <b id="estado">Aguardando</b></div>

  <hr style="border-color: #334155; margin: 15px 0;">
  
  <input type="time" id="hora">
  <input type="number" id="segundos" min="2" max="499" placeholder="Duração em segundos (ex: 10)">
  <button class="btn-add" onclick="agendar()">+ Agendar Horário</button>
  <ul id="lista"></ul>
</div>

<script>
let writer, agenda = [];

async function conectar() {
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 9600 });
    writer = port.writable.getWriter();
    document.getElementById('status').innerHTML = '<span style="color:#10b981">● Conectado</span>';
  } catch (e) { alert('Erro: ' + e.message); }
}

async function enviar(cmd, texto) {
  if (!writer) return alert('Conecte o Arduino primeiro!');
  await writer.write(new TextEncoder().encode(cmd + '\n'));
  document.getElementById('estado').innerText = texto;
}

function agendar() {
  const hora = document.getElementById('hora').value;
  const seg = parseInt(document.getElementById('segundos').value);
  if (!hora || !seg || seg < 2) return alert('Informe o horário e pelo menos 2 segundos!');
  agenda.push({ hora, seg, feito: false });
  render();
}

function render() {
  document.getElementById('lista').innerHTML = agenda.map((item, i) => 
    `<li><span><b>${item.hora}</b> por <b>${item.seg}s</b></span>
     <button class="del" onclick="agenda.splice(${i},1);render()">X</button></li>`
  ).join('');
}

setInterval(() => {
  const agora = new Date().toTimeString().slice(0, 5);
  agenda.forEach(item => {
    if (item.hora === agora && !item.feito) {
      enviar(String(item.seg), `LIGADO (${item.seg}s)`);
      item.feito = true;
      setTimeout(() => document.getElementById('estado').innerText = 'DESLIGADO', item.seg * 1000);
    }
    if (item.hora !== agora) item.feito = false;
  });
}, 1000);
</script>
</body>
</html>
